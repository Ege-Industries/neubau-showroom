<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termin bestätigen | Neubaublick</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg">
<style>
:root{--b:#0a6fb8;--ink:#0f2438;--ink2:#5b6b7a;--bg:#eef6fc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink)}
.k{width:100%;max-width:520px;background:#fff;border-radius:16px;padding:30px 28px;box-shadow:0 10px 40px rgba(15,36,56,.08)}
.marke{font:800 13px/1 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--b);margin-bottom:22px}
h1{font-size:22px;line-height:1.3;margin:0 0 8px}p{margin:0 0 14px;color:var(--ink2)}
.wann{font-size:20px;font-weight:700;color:var(--ink);margin:18px 0 4px}.dauer{color:var(--ink2);margin-bottom:22px}
button,.btn{display:inline-block;border:0;border-radius:10px;padding:14px 22px;font:700 16px -apple-system,Helvetica,Arial,sans-serif;cursor:pointer;text-decoration:none}
.ja{background:var(--b);color:#fff;width:100%}.ja:disabled{opacity:.6}
.zeile{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.zweit{background:#fff;color:var(--b);border:1px solid var(--b);padding:11px 16px;font-size:14px}
.meet{display:block;margin:6px 0 18px;font-weight:700;color:var(--b);word-break:break-all}
.ok{display:none}.fehler{color:#b3261e}.fuss{margin-top:24px;font-size:12px;color:#8a97a3}
</style></head><body><main class="k">
<div class="marke">Neubaublick</div>
<section id="frage"><h1 id="titel">Termin bestätigen</h1><p id="fuer"></p>
<div class="wann" id="wann">…</div><div class="dauer">15 Minuten · Google Meet · mit Ege Pürgül</div>
<button class="ja" id="ja" type="button">Ja, dieser Termin passt</button><p class="fehler" id="fehler"></p></section>
<section class="ok" id="ok"><h1>Danke, der Termin steht.</h1><p>Ege Pürgül weiß Bescheid. So treten Sie bei:</p>
<div class="wann" id="wann2"></div><a class="meet" id="meet" target="_blank" rel="noopener"></a>
<p style="margin-bottom:6px">In Ihren Kalender eintragen:</p>
<div class="zeile"><a class="btn zweit" id="gcal" target="_blank" rel="noopener">Google Kalender</a><a class="btn zweit" id="ocal" target="_blank" rel="noopener">Outlook</a><a class="btn zweit" id="ics" download="Termin.ics">Apple / andere (.ics)</a></div></section>
<div class="fuss">Ege Pürgül · Neubaublick · 3D-Projektseiten für Bauträger · <a href="/" style="color:inherit">neubaublick.de</a></div>
</main><script>
// Bestätigung einer vorgeschlagenen Uhrzeit: erst auf Klick (Firmen-Virenscanner öffnen Links automatisch und dürfen nichts bestätigen)
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const u = +q.get('u'), meet = q.get('m') ? 'https://meet.google.com/' + q.get('m').replace(/[^a-z\-]/g, '') : '', proj = (q.get('p') || '').slice(0, 120), t = (q.get('t') || '').replace(/[^\w\-]/g, ''), l = (q.get('l') || '').replace(/\W/g, '');
const beginn = new Date(u * 1000), ende = new Date((u + 15 * 60) * 1000);
const wann = isNaN(u) || !u ? '' : beginn.toLocaleString('de-DE', { timeZone: 'Europe/Berlin', weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + ' Uhr';
$('wann').textContent = wann || 'Unbekannter Termin'; $('wann2').textContent = wann;
if (proj) $('fuer').textContent = 'Vorschau der 3D-Projektseite für ' + proj + ' per Google Meet.';
if (!wann || !t) { $('ja').disabled = true; $('fehler').textContent = 'Dieser Link ist unvollständig. Antworten Sie gern einfach auf die Mail.'; }
const utc = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const titel = 'Neubaublick: Vorschau' + (proj ? ' ' + proj : '') + ' (15 Min.)', text = 'Google Meet: ' + meet + '\n\nMit Ege Pürgül, Neubaublick (ege@neubaublick.de)';
$('meet').href = meet; $('meet').textContent = meet;
$('gcal').href = 'https://calendar.google.com/calendar/render?' + new URLSearchParams({ action: 'TEMPLATE', text: titel, dates: utc(beginn) + '/' + utc(ende), details: text, location: meet });
$('ocal').href = 'https://outlook.office.com/calendar/0/deeplink/compose?' + new URLSearchParams({ path: '/calendar/action/compose', rru: 'addevent', subject: titel, startdt: beginn.toISOString(), enddt: ende.toISOString(), body: text, location: meet });
const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Neubaublick//Termin//DE', 'BEGIN:VEVENT', 'UID:termin-' + l + '-' + u + '@neubaublick.de', 'DTSTAMP:' + utc(new Date()), 'DTSTART:' + utc(beginn), 'DTEND:' + utc(ende),
  'SUMMARY:' + titel, 'DESCRIPTION:' + text.replace(/\n/g, '\\n'), 'LOCATION:' + meet, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
$('ics').href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
$('ja').addEventListener('click', async () => {
  $('ja').disabled = true; $('ja').textContent = 'Wird bestätigt …';
  try {
    const r = await fetch('https://ntfy.sh/' + t + '?' + new URLSearchParams({ title: 'Termin angenommen', priority: '5', tags: 'zusage,l-' + l + ',u-' + u }),
      { method: 'POST', body: (proj ? proj + ': ' : '') + wann });
    if (!r.ok) throw new Error(r.status);
    $('frage').style.display = 'none'; $('ok').style.display = 'block';
  } catch (e) { $('ja').disabled = false; $('ja').textContent = 'Ja, dieser Termin passt'; $('fehler').textContent = 'Das hat gerade nicht geklappt. Bitte nochmal tippen oder kurz auf die Mail antworten.'; }
});
</script></body></html>
